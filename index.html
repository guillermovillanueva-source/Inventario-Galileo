<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario Galileo - Service Desk Admin</title>

  <!-- Favicon Dinámico Isotipo "IG" -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23171a1f'/><circle cx='50' cy='50' r='42' fill='none' stroke='%233b82f6' stroke-width='4'/><text x='30' y='68' font-family='Arial, sans-serif' font-weight='900' font-size='50' fill='%233b82f6'>I</text><text x='48' y='68' font-family='Arial, sans-serif' font-weight='900' font-size='50' fill='%23ffffff'>G</text></svg>" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f1115] text-[#9ea4b0] font-sans antialiased flex h-screen overflow-hidden text-xs">

  <!-- MODAL DE LOGIN OBLIGATORIO -->
  <div id="loginModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-[#171a1f] border border-[#242830] rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-5">
      <div class="text-center space-y-1">
        <div class="w-14 h-14 bg-[#0f1115] border border-blue-500/40 rounded-2xl mx-auto flex items-center justify-center font-black text-2xl mb-3 shadow-[0_0_20px_rgba(59,130,246,0.2)]">
          <span class="text-blue-500">I</span><span class="text-white">G</span>
        </div>
        <h2 class="text-lg font-bold text-white">Acceso a Service Desk Galileo</h2>
        <p class="text-xs text-slate-400">Ingresa tu correo corporativo para conectarte a Google Sheets</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-slate-400 mb-1 font-medium">Correo Electrónico</label>
          <input type="email" id="loginMail" required class="w-full bg-[#0f1115] border border-[#242830] text-slate-200 px-3.5 py-2.5 rounded-lg focus:outline-none focus:border-blue-500 text-xs" placeholder="nombre@benandfrank.com">
        </div>

        <div>
          <label class="block text-slate-400 mb-1 font-medium">Unidad de Negocio (BU)</label>
          <select id="loginBU" required class="w-full bg-[#0f1115] border border-[#242830] text-slate-200 px-3.5 py-2.5 rounded-lg focus:outline-none focus:border-blue-500 text-xs">
            <option value="" disabled selected>Selecciona tu BU...</option>
            <option value="Operaciones">Operaciones</option>
            <option value="HQ">HQ</option>
            <option value="Retail">Retail</option>
            <option value="Tech">Tech</option>
          </select>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg transition shadow-lg shadow-blue-600/20">
          Ingresar al Portal
        </button>
      </form>
    </div>
  </div>

  <!-- Sidebar Lateral -->
  <aside class="w-64 bg-[#171a1f] border-r border-[#242830] flex flex-col justify-between shrink-0 z-40 hidden md:flex">
    <div>
      <div class="h-14 px-6 border-b border-[#242830] flex items-center justify-between">
        <div class="flex items-center gap-2.5 font-bold text-white text-sm">
          <div class="w-8 h-8 bg-[#0f1115] border border-blue-500/50 rounded-xl flex items-center justify-center font-black text-sm shrink-0">
            <span class="text-blue-500">I</span><span class="text-white">G</span>
          </div>
          <div class="flex flex-col leading-tight">
            <span>Service Desk Galileo</span>
            <span class="text-[9px] text-blue-400 font-mono font-semibold uppercase">ITAM LIVE</span>
          </div>
        </div>
      </div>

      <nav class="p-4 space-y-2">
        <div class="px-3 py-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Tablas Relacionales</div>
        
        <button onclick="switchRelationalView('inventario')" id="nav-inventario" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg bg-blue-600/10 text-blue-400 border border-blue-500/20 font-medium transition">
          💻 Inventario
        </button>
        <button onclick="switchRelationalView('asignaciones')" id="nav-asignaciones" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
          📋 Asignaciones
        </button>
        <button onclick="switchRelationalView('tiendas')" id="nav-tiendas" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
          🏪 Tiendas
        </button>
        <button onclick="switchRelationalView('usuarios')" id="nav-usuarios" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
          👤 Usuarios
        </button>
        <button onclick="switchRelationalView('movimientos')" id="nav-movimientos" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
          🔄 Movimientos
        </button>
      </nav>
    </div>

    <div class="p-4 border-t border-[#242830] text-[10px] text-slate-600 flex justify-between items-center">
      <span>Galileo ITAM © 2026</span>
      <span id="syncIndicator" class="w-2 h-2 rounded-full bg-emerald-500" title="Conectado a Google Sheets"></span>
    </div>
  </aside>

  <!-- Contenido Central -->
  <div class="flex-1 flex flex-col h-full overflow-y-auto">

    <header class="h-14 bg-[#171a1f] border-b border-[#242830] px-6 flex items-center justify-between shrink-0 sticky top-0 z-30">
      <div class="flex items-center gap-4 flex-1 max-w-md">
        <input type="text" id="searchInput" placeholder="Buscar registros..." class="w-full bg-[#0f1115] text-slate-200 px-4 py-1.5 rounded-lg border border-[#242830] focus:outline-none focus:border-blue-500 text-xs placeholder-slate-600" />
      </div>

      <div class="flex items-center gap-4">
        <button onclick="fetchDatabaseFromSheets()" class="bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 border border-blue-500/30 px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5 transition">
          🔄 Sincronizar Sheets
        </button>

        <div class="flex items-center gap-2 border-l border-[#242830] pl-4">
          <div id="userAvatar" class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold text-xs uppercase">--</div>
          <div class="hidden sm:block text-left">
            <p id="userMailDisplay" class="text-white font-bold leading-none text-xs">Cargando...</p>
            <span id="userBUDisplay" class="text-[10px] text-slate-500">--</span>
          </div>
        </div>
      </div>
    </header>

    <main class="p-6 space-y-6 max-w-[1600px] w-full mx-auto">

      <!-- CONSULTAS RÁPIDAS -->
      <div class="bg-[#171a1f] p-4 rounded-xl border border-[#242830] shadow-xl space-y-3">
        <h3 class="text-xs font-bold text-blue-400 uppercase tracking-wider">Consultas Rápidas de Negocio</h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
          <button onclick="answerQuery('equipos_tienda')" class="bg-[#0f1115] hover:bg-blue-600/20 border border-[#242830] text-slate-300 p-2.5 rounded-lg transition text-left">
            <span class="block font-bold text-white text-[11px]">🏪 Equipos / Tienda</span>
            <span class="text-[9px] text-slate-500">¿Qué tiene cada tienda?</span>
          </button>
          <button onclick="answerQuery('laptop_usuario')" class="bg-[#0f1115] hover:bg-blue-600/20 border border-[#242830] text-slate-300 p-2.5 rounded-lg transition text-left">
            <span class="block font-bold text-white text-[11px]">💻 Laptop / Usuario</span>
            <span class="text-[9px] text-slate-500">¿Quién tiene cada laptop?</span>
          </button>
          <button onclick="answerQuery('equipos_apple')" class="bg-[#0f1115] hover:bg-blue-600/20 border border-[#242830] text-slate-300 p-2.5 rounded-lg transition text-left">
            <span class="block font-bold text-white text-[11px]">🍎 Equipos Apple</span>
            <span class="text-[9px] text-slate-500">Inventario marca Apple</span>
          </button>
          <button onclick="answerQuery('sin_usuario')" class="bg-[#0f1115] hover:bg-blue-600/20 border border-[#242830] text-slate-300 p-2.5 rounded-lg transition text-left">
            <span class="block font-bold text-white text-[11px]">📦 Sin Asignar</span>
            <span class="text-[9px] text-slate-500">Equipos disponibles</span>
          </button>
          <button onclick="answerQuery('fuera_garantia')" class="bg-[#0f1115] hover:bg-blue-600/20 border border-[#242830] text-slate-300 p-2.5 rounded-lg transition text-left">
            <span class="block font-bold text-white text-[11px]">⚠️ Fuera Garantía</span>
            <span class="text-[9px] text-slate-500">Garantías vencidas</span>
          </button>
          <button onclick="answerQuery('cambio_tienda')" class="bg-[#0f1115] hover:bg-blue-600/20 border border-[#242830] text-slate-300 p-2.5 rounded-lg transition text-left">
            <span class="block font-bold text-white text-[11px]">🔄 Reubicados</span>
            <span class="text-[9px] text-slate-500">Cambios de tienda</span>
          </button>
        </div>
      </div>

      <!-- TABLA PRINCIPAL -->
      <div class="bg-[#171a1f] rounded-xl border border-[#242830] shadow-xl overflow-hidden">
        <div class="p-4 border-b border-[#242830] flex justify-between items-center">
          <h2 id="viewTitle" class="text-sm font-bold text-white">Inventario de Equipos</h2>
          <span id="recordCount" class="text-xs font-mono bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-lg">0 Registros</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-300">
            <thead id="tableHeader" class="bg-[#0f1115] text-slate-400 uppercase tracking-wider border-b border-[#242830] text-[10px]"></thead>
            <tbody id="tableBody" class="divide-y divide-[#242830]">
              <tr><td colspan="10" class="text-center p-8 text-slate-600">Inicia sesión para cargar datos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script>
    // URL DE TU APP WEB EN GOOGLE APPS SCRIPT INTEGRADA
    const API_URL = 'https://script.google.com/a/macros/benandfrank.com/s/AKfycbxG7-DwJ_m4wxIW5ZBhD1AocKvTgKE5LVZw-DGQx42l6dRczPo0DHvxvTmhzkUwUTaN/exec';

    let db = { tiendas: [], usuarios: [], inventario: [], asignaciones: [], historial: [] };
    let activeRelationalView = 'inventario';

    function handleLogin(e) {
      e.preventDefault();
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('userMailDisplay').innerText = document.getElementById('loginMail').value;
      document.getElementById('userBUDisplay').innerText = document.getElementById('loginBU').value;
      fetchDatabaseFromSheets();
    }

    async function fetchDatabaseFromSheets() {
      const indicator = document.getElementById('syncIndicator');
      const body = document.getElementById('tableBody');
      indicator.className = "w-2 h-2 rounded-full bg-amber-500 animate-pulse";
      body.innerHTML = `<tr><td colspan="10" class="text-center p-8 text-blue-400">Obteniendo 5 tablas relacionales desde Google Sheets...</td></tr>`;

      try {
        const response = await fetch(API_URL);
        const json = await response.json();

        if (json.status === 'success') {
          db.tiendas = json.data.tiendas || [];
          db.usuarios = json.data.usuarios || [];
          db.inventario = json.data.inventario || [];
          db.asignaciones = json.data.asignaciones || [];
          db.historial = json.data.historial || [];

          indicator.className = "w-2 h-2 rounded-full bg-emerald-500";
          renderCurrentView();
        } else {
          alert("Error de respuesta: " + json.data);
        }
      } catch (err) {
        indicator.className = "w-2 h-2 rounded-full bg-rose-500";
        body.innerHTML = `<tr><td colspan="10" class="text-center p-8 text-rose-400">Error al conectar con la API Web. Verifica permisos de acceso en Apps Script.</td></tr>`;
      }
    }

    function switchRelationalView(view) {
      activeRelationalView = view;
      ['inventario', 'asignaciones', 'tiendas', 'usuarios', 'movimientos'].forEach(v => {
        const btn = document.getElementById(`nav-${v}`);
        if (btn) btn.className = (v === view) 
          ? "w-full flex items-center gap-3 px-3 py-2 rounded-lg bg-blue-600/10 text-blue-400 border border-blue-500/20 font-medium transition"
          : "w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition";
      });
      renderCurrentView();
    }

    function renderCurrentView() {
      const header = document.getElementById('tableHeader');
      const body = document.getElementById('tableBody');
      const title = document.getElementById('viewTitle');
      const count = document.getElementById('recordCount');

      if (activeRelationalView === 'inventario') {
        title.innerText = "Inventario de Equipos";
        count.innerText = `${db.inventario.length} Registros`;
        header.innerHTML = `<tr><th class="p-3">Asset ID</th><th class="p-3">Tipo</th><th class="p-3">Marca</th><th class="p-3">Modelo</th><th class="p-3">Serie</th><th class="p-3">CPU/RAM</th><th class="p-3">Garantía</th><th class="p-3">Estatus</th></tr>`;
        
        body.innerHTML = db.inventario.map(item => `
          <tr class="hover:bg-[#1f232b] transition-colors">
            <td class="p-3 font-mono text-blue-400 font-bold">${item['Asset ID'] || 'N/A'}</td>
            <td class="p-3 text-slate-200">${item['Tipo'] || ''}</td>
            <td class="p-3 text-emerald-400 font-semibold">${item['Marca'] || ''}</td>
            <td class="p-3 text-white">${item['Modelo'] || ''}</td>
            <td class="p-3 font-mono text-slate-400 text-[11px]">${item['Serie'] || ''}</td>
            <td class="p-3 text-slate-400">${item['CPU'] || ''} / ${item['RAM'] || ''}</td>
            <td class="p-3 text-slate-300 font-mono">${item['Garantía'] || ''}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${item['Estatus'] === 'Asignado' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'}">${item['Estatus'] || 'Stock'}</span></td>
          </tr>
        `).join('');

      } else if (activeRelationalView === 'asignaciones') {
        title.innerText = "Asignaciones Actuales";
        count.innerText = `${db.asignaciones.length} Registros`;
        header.innerHTML = `<tr><th class="p-3">Asset ID</th><th class="p-3">Usuario</th><th class="p-3">Tienda</th><th class="p-3">Ubicación Física</th><th class="p-3">Fecha Asignación</th><th class="p-3">Responsable</th></tr>`;
        
        body.innerHTML = db.asignaciones.map(asg => {
          const usr = db.usuarios.find(u => String(u['ID Empleado']) === String(asg['Usuario']));
          const tnd = db.tiendas.find(t => String(t['ID Tienda']) === String(asg['Tienda']));
          return `
            <tr class="hover:bg-[#1f232b] transition-colors">
              <td class="p-3 font-mono text-blue-400 font-bold">${asg['Asset ID']}</td>
              <td class="p-3 font-semibold text-white">${usr ? `${usr['Nombre']} (${usr['Correo']})` : '<span class="text-amber-400">Sin Usuario</span>'}</td>
              <td class="p-3 text-purple-400 font-medium">${tnd ? tnd['Nombre'] : asg['Tienda']}</td>
              <td class="p-3 text-slate-300">${asg['Ubicación física'] || ''}</td>
              <td class="p-3 font-mono text-slate-400">${asg['Fecha asignación'] || ''}</td>
              <td class="p-3 text-slate-400">${asg['Responsable'] || ''}</td>
            </tr>
          `;
        }).join('');
      }
    }

    function answerQuery(queryType) {
      const header = document.getElementById('tableHeader');
      const body = document.getElementById('tableBody');
      const title = document.getElementById('viewTitle');
      const count = document.getElementById('recordCount');

      if (queryType === 'equipos_tienda') {
        title.innerText = "Consulta: ¿Qué equipo tiene cada tienda?";
        header.innerHTML = `<tr><th class="p-3">Tienda</th><th class="p-3">Asset ID</th><th class="p-3">Equipo</th><th class="p-3">Serie</th><th class="p-3">Usuario Asignado</th></tr>`;
        
        body.innerHTML = db.asignaciones.map(asg => {
          const tnd = db.tiendas.find(t => String(t['ID Tienda']) === String(asg['Tienda']));
          const eq = db.inventario.find(i => String(i['Asset ID']) === String(asg['Asset ID']));
          const usr = db.usuarios.find(u => String(u['ID Empleado']) === String(asg['Usuario']));
          return `
            <tr class="hover:bg-[#1f232b] transition-colors">
              <td class="p-3 font-bold text-purple-400">${tnd ? tnd['Nombre'] : asg['Tienda']}</td>
              <td class="p-3 font-mono text-blue-400">${asg['Asset ID']}</td>
              <td class="p-3 text-white font-medium">${eq ? `${eq['Marca']}${eq['Modelo']}` : 'N/D'}</td>
              <td class="p-3 font-mono text-slate-400">${eq ? eq['Serie'] : 'N/D'}</td>
              <td class="p-3 text-slate-300">${usr ? usr['Nombre'] : '<span class="text-amber-400">Disponible</span>'}</td>
            </tr>
          `;
        }).join('');
        count.innerText = `${db.asignaciones.length} Registros`;

      } else if (queryType === 'equipos_apple') {
        title.innerText = "Consulta: ¿Cuántos equipos Apple tenemos?";
        const apples = db.inventario.filter(i => String(i['Marca']).toLowerCase().includes('apple'));
        header.innerHTML = `<tr><th class="p-3">Asset ID</th><th class="p-3">Modelo</th><th class="p-3">Serie</th><th class="p-3">RAM/CPU</th><th class="p-3">Estatus</th></tr>`;
        
        body.innerHTML = apples.map(eq => `
          <tr class="hover:bg-[#1f232b] transition-colors">
            <td class="p-3 font-mono text-blue-400">${eq['Asset ID']}</td>
            <td class="p-3 text-white font-bold">${eq['Modelo']}</td>
            <td class="p-3 font-mono text-slate-400">${eq['Serie']}</td>
            <td class="p-3 text-slate-300">${eq['CPU']} / ${eq['RAM']}</td>
            <td class="p-3 text-emerald-400 font-semibold">${eq['Estatus']}</td>
          </tr>
        `).join('');
        count.innerText = `${apples.length} Equipos Apple`;
      }
    }
  </script>
</body>
</html>
